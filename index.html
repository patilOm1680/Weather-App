<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="shortcut icon" href="./assets/weatherFavicon.png" type="image/x-icon">
</head>

<body>
  <div class="weatherContainer">
    <div class="weatherCard">
      <!-- search box -->
      <div class="search-box">
        <input type="text" placeholder="Search Location..." id="searchInp" list="suggestionList" autocomplete="off">
        <datalist id="suggestionList">
          <option value="Nashik"></option>
          <option value="Mumbai"></option>
          <option value="Delhi"></option>
          <option value="Dubai"></option>
          <option value="Australia"></option>

        </datalist>
        <button id="searchIcon"><i class="bi bi-search"></i></button>
      </div>

      <div class="titleInfo">
        <div class="temperature">
          <h1 id="temp">--°</h1>
          <h2 id="city">Loading...</h2>
          <p id="date"></p>
          <p id="desc" class="description">---</p>
        </div>
        <img id="weatherIcon" src="" alt="Weather Icon">
      </div>
      <div class="details">
        <h3>Weather Details</h3>

        <div class="row">
          <span>Temp Max</span><span id="tempMax">-- °C</span>
        </div>
        <div class="row">
          <span>Temp Min</span>
          <span id="tempMin">-- °C</span>
        </div>
        <div class="row">
          <span>Humidity</span>
          <span id="humidity">--%</span>
        </div>
        <div class="row">
          <span>Cloudy</span>
          <span id="cloudy">--%</span>
        </div>
        <div class="row">
          <span>Wind Speed</span>
          <span id="windSpeed">-- Km/hr</span>
        </div>

        <!-- <div class="row">
          <span>Pressure</span>
          <span id="pressure">-- Km/hr</span>
        </div> -->
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
